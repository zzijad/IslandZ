name: Build IslandZ

# Svaki push se prevodi (provera da kod prolazi).
# Release ide automatski sa grane main: povecaj <Version> u src/IslandZ/IslandZ.csproj i pushaj.
# Ako tag v<verzija> vec postoji, novi release se ne pravi.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        run: |
          VER=$(grep -oP '(?<=<Version>)[^<]+' "src/IslandZ/IslandZ.csproj" | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "Nije main, samo provera"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VER vec postoji"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "Novi release v$VER"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Prevodjenje i pakovanje
        run: msbuild src\IslandZ\IslandZ.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir=${{ github.workspace }}\publish\

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath IslandZ.zip

      - name: Release v${{ steps.v.outputs.version }}
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: IslandZ v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: IslandZ.zip

      - name: Artifact (kad nema novog release-a, cuva se 3 dana)
        if: steps.v.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IslandZ
          path: IslandZ.zip
          retention-days: 3
